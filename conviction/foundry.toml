[profile.default]
src        = "contracts/src"
out        = "contracts/out"
libs       = ["node_modules", "lib"]
test       = "contracts/test"
script     = "contracts/script"
cache_path = "contracts/cache"

# Arc targets the Osaka EVM baseline
evm_version  = "osaka"
solc_version = "0.8.26"
optimizer    = true
optimizer_runs = 200
via_ir       = true

# Arc testnet
[rpc_endpoints]
arc_testnet = "https://rpc.testnet.arc.io"

[etherscan]
arc_testnet = { key = "NONE", url = "https://explorer.testnet.arc.io/api" }

[fmt]
line_length   = 120
tab_width     = 4
bracket_spacing = true
